services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-research}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - research_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://research:${POSTGRES_PASSWORD}@postgres:5432/research
      CHECKPOINT_DATABASE_URL: postgresql://research:${POSTGRES_PASSWORD}@postgres:5432/research
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - uvicorn
      - research_assistant.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://research:${POSTGRES_PASSWORD}@postgres:5432/research
      CHECKPOINT_DATABASE_URL: postgresql://research:${POSTGRES_PASSWORD}@postgres:5432/research
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - research_assistant.infrastructure.jobs.worker

volumes:
  research_pgdata:
