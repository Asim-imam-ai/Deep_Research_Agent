[project]
name = "langgraph-research-assistant"
version = "0.1.0"
description = "Phase 3: persistent multi-agent research API and worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-tavily>=0.2.18,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "langgraph-checkpoint-postgres>=2,<4",
  "tavily-python>=0.8.5",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "httpx>=0.27,<1"]
[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]
[tool.hatch.build]
include = ["src/research_assistant/**/*.py", "src/research_assistant/prompts/**/*.md"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
